services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - external-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://ubb:ubb@db:5432/ubb
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - external-net

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ubb
      POSTGRES_USER: ubb
      POSTGRES_PASSWORD: ubb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubb -d ubb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - external-net

volumes:
  pgdata:

networks:
  external-net:
    external: ${USE_EXTERNAL_NET:-true}
    name: ${EXTERNAL_NET}
