services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-America/Recife}
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - internal-net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.ubb-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.ubb-frontend.entrypoints=websecure"
      - "traefik.http.routers.ubb-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ubb-frontend.middlewares=security-headers@file,maintenance-on-error@file"
      - "traefik.http.services.ubb-frontend.loadbalancer.server.port=3000"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Recife}
      - DATABASE_URL=postgresql+asyncpg://ubb:ubb@db:5432/ubb
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal-net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.ubb-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.ubb-api.entrypoints=websecure"
      - "traefik.http.routers.ubb-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ubb-api.middlewares=security-headers@file,maintenance-on-error@file"
      - "traefik.http.services.ubb-api.loadbalancer.server.port=8000"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ubb
      POSTGRES_USER: ubb
      POSTGRES_PASSWORD: ubb
      TZ: ${TZ:-America/Recife}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubb -d ubb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal-net

  sync:
    build:
      context: ./backend
      dockerfile: Dockerfile.sync
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Recife}
      - DATABASE_URL=postgresql+asyncpg://ubb:ubb@db:5432/ubb
      - CLASSIFIER=${CLASSIFIER:-gemini}
      - MOZ_DISABLE_CONTENT_SANDBOX=1
      - SYNC_SCHEDULE=${SYNC_SCHEDULE:-08:00,14:00,20:00}
      - SYNC_ARGS=${SYNC_ARGS:---headless}
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./.linkedin_browser:/app/.linkedin_browser
      - gemini-config:/root/.gemini # auth/config do Gemini CLI e do agy (mesmo diretório)
      - firefox-cache:/root/.cache/invisible-playwright
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal-net

volumes:
  pgdata:
  gemini-config:
  firefox-cache:

networks:
  internal-net:
  proxy:
    external: true
    name: proxy
